name: PR Validation

on:
  pull_request:
    types: [opened, edited]

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-template:
    name: Validate PR Template
    runs-on: bayer-int-external-linux
    steps:

      # ──────────────────────────────────────────────
      # Sugere o template correto ao abrir o PR
      # ──────────────────────────────────────────────
      - name: Suggest Correct Template
        if: github.event_name == 'pull_request' || github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const prUrl  = context.payload.pull_request.html_url;

            let templateUrl  = null;
            let templateName = null;

            if (branch.startsWith('hotfix/') || branch.startsWith('fix/')) {
              templateUrl  = `${prUrl}?template=hotfix_template.md`;
              templateName = '🔥 Hotfix Template';
            } else if (branch.startsWith('release/')) {
              templateUrl  = `${prUrl}?template=release_template.md`;
              templateName = '🚀 Release Template';
            }

            if (templateUrl) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## 📋 Template Sugerido\n\n` +
                      `Detectamos que sua branch é **\`${branch}\`**.\n\n` +
                      `👉 [Clique aqui para usar o ${templateName}](${templateUrl})\n\n` +
                      `> Se já estiver usando o template correto, ignore esta mensagem.`
              });
            }

      # ──────────────────────────────────────────────
      # Valida template de hotfix/fix
      # ──────────────────────────────────────────────
      - name: Validate Hotfix/Fix Template
        if: startsWith(github.head_ref, 'hotfix/') || startsWith(github.head_ref, 'fix/')
        uses: actions/github-script@v7
        with:
          script: |
            const prBody = context.payload.pull_request.body || '';

            // Database changes validation
            const hasDbChanges       = prBody.match(/- \[x\] Yes, database changes required/i);
            const noDbChanges        = prBody.match(/- \[x\] No database changes/i);
            const liquibaseLink      = prBody.match(/Liquibase PR:\s*\[([^\]]+)\]\(([^)]+)\)/);
            const hasValidLiquibase  = liquibaseLink && liquibaseLink[2] && !liquibaseLink[2].includes('LINK-PR');

            // Frontend PR validation
            const hasFrontendChanges = prBody.match(/- \[x\] Yes, frontend PR (required|included)/i);
            const noFrontendChanges  = prBody.match(/- \[x\] No frontend changes/i);
            const frontendLink       = prBody.match(/Frontend PR:\s*\[([^\]]+)\]\(([^)]+)\)/);
            const hasValidFrontend   = frontendLink && frontendLink[2] && !frontendLink[2].includes('LINK-PR');

            let issues = [];

            if (!hasDbChanges && !noDbChanges) {
              issues.push('❌ **Database changes section** - Selecione "No database changes" ou "Yes, database changes required".');
            } else if (hasDbChanges && !hasValidLiquibase) {
              issues.push('❌ **Database changes marcado**, mas o link do Liquibase PR não foi fornecido.');
            }

            if (!hasFrontendChanges && !noFrontendChanges) {
              issues.push('❌ **Frontend changes section** - Selecione "No frontend changes" ou "Yes, frontend PR required".');
            } else if (hasFrontendChanges && !hasValidFrontend) {
              issues.push('❌ **Frontend changes marcado**, mas o link do Frontend PR não foi fornecido.');
            }

            const hasRootCause      = prBody.match(/### Root Cause\s*\n\s*[^_\s]/);
            const hasSolution       = prBody.match(/### Solution Implemented\s*\n\s*[^_\s]/);
            const hasTestEvidence   = prBody.match(/## Testing Evidence\s*\n\s*[^_\s]/);

            if (!hasRootCause)    issues.push('⚠️ **Root Cause** não preenchido.');
            if (!hasSolution)     issues.push('⚠️ **Solution Implemented** não preenchido.');
            if (!hasTestEvidence) issues.push('⚠️ **Testing Evidence** não preenchido.');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Hotfix Template Validation')
            );

            if (issues.length > 0) {
              const body = `## 🔍 Hotfix Template Validation\n\n${issues.join('\n')}\n\n---\n\n` +
                           `**Preencha todas as seções obrigatórias do template.**\n\n` +
                           `**Dicas:**\n` +
                           `- Database changes: selecione No ou Yes\n` +
                           `- Frontend changes: selecione No ou Yes\n` +
                           `- Se Yes para banco, adicione o link do Liquibase PR\n` +
                           `- Se Yes para frontend, adicione o link do Frontend PR`;

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body
                });
              }

              core.setFailed('Hotfix template incompleto ou inválido');
            } else if (botComment) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
              });
            }

      # ──────────────────────────────────────────────
      # Valida template de release
      # ──────────────────────────────────────────────
      - name: Validate Release Template
        if: startsWith(github.head_ref, 'release/')
        uses: actions/github-script@v7
        with:
          script: |
            const prBody        = context.payload.pull_request.body || '';
            const prUrl         = context.payload.pull_request.html_url;
            const isRelease     = prBody.includes('## Release Information');

            let issues = [];

            if (!isRelease) {
              issues.push(`❌ **Template incorreto** - Use o Release Template: [Clique aqui](${prUrl}?template=release_template.md)`);
            } else {
              const hasFrontend      = prBody.match(/- \[x\] Yes, frontend PR included/i);
              const noFrontend       = prBody.match(/- \[x\] No frontend changes/i);
              const frontendLink     = prBody.match(/Frontend PR:\s*\[([^\]]+)\]\(([^)]+)\)/);
              const hasValidFrontend = frontendLink && frontendLink[2] && !frontendLink[2].includes('LINK-PR');

              if (!hasFrontend && !noFrontend) {
                issues.push('❌ **Frontend changes section** - Selecione "No frontend changes" ou "Yes, frontend PR included".');
              } else if (hasFrontend && !hasValidFrontend) {
                issues.push('❌ **Frontend changes marcado**, mas o link do Frontend PR não foi fornecido.');
              }
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Release Template Validation')
            );

            if (issues.length > 0) {
              const body = `## ⚠️ Release Template Validation\n\n${issues.join('\n')}\n\n---\n\n` +
                           `**Certifique-se de usar o template correto e preencher todas as seções.**`;

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body
                });
              }

              core.setFailed('Release template inválido');
            } else if (botComment) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
              });
            }

      # ──────────────────────────────────────────────
      # Valida template padrão (feature, chore, etc.)
      # ──────────────────────────────────────────────
      - name: Validate Default Template
        if: |
          !startsWith(github.head_ref, 'hotfix/') &&
          !startsWith(github.head_ref, 'fix/') &&
          !startsWith(github.head_ref, 'release/')
        uses: actions/github-script@v7
        with:
          script: |
            const prBody = context.payload.pull_request.body || '';

            const isHotfixTemplate  = prBody.includes('## Hotfix');
            const isReleaseTemplate = prBody.includes('## Release Information');

            const hasDescribe   = prBody.includes('## Describe your changes');
            const hasIssue      = prBody.includes('## Issue ticket number and link');
            const hasChecklist  = prBody.includes('## Checklist before requesting a review');

            let issues = [];

            if (isHotfixTemplate || isReleaseTemplate) {
              const type = isHotfixTemplate ? 'hotfix' : 'release';
              issues.push(`❌ **Template incorreto** - Template de ${type} usado em branch que não é de ${type}.`);
            } else if (!hasDescribe || !hasIssue || !hasChecklist) {
              issues.push('⚠️ **Seções obrigatórias faltando** no template padrão.');
            } else {
              const noFrontend       = prBody.match(/- \[x\] No frontend changes/i);
              const hasFrontend      = prBody.match(/- \[x\] Yes, frontend PR included/i);
              const frontendLink     = prBody.match(/Frontend PR:\s*\[([^\]]+)\]\(([^)]+)\)/);
              const hasValidFrontend = frontendLink && frontendLink[2] && !frontendLink[2].includes('LINK-PR');

              if (!noFrontend && !hasFrontend) {
                issues.push('❌ **Frontend PR section** - Selecione "No frontend changes" ou "Yes, frontend PR included".');
              } else if (hasFrontend && !hasValidFrontend) {
                issues.push('❌ **Frontend PR marcado**, mas o link não foi fornecido.');
              }
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Template Validation')
            );

            if (issues.length > 0) {
              const body = `## 📋 Template Validation\n\n${issues.join('\n')}\n\n---\n\n` +
                           `**O PR deve conter:**\n` +
                           `- \`## Describe your changes\`\n` +
                           `- \`## Issue ticket number and link\`\n` +
                           `- \`## Checklist before requesting a review\`\n` +
                           `- **Frontend PR**: selecione No ou Yes (com link)`;

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body
                });
              }

              core.setFailed('Template padrão inválido');
            } else if (botComment) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
              });
            }